<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Calculator</title>
</head>
<body>
  <div class="main-div">
    <div id="box1">1</div>
    <button class="box" id="box2">C</button>
    <button class="box" id="box3">D</button>
    <button class="box" id="box4">%</button>
    <button class="box" id="box5">÷</button>
    <button class="box" id="box6">7</button>
    <button class="box" id="box7">8</button>
    <button class="box" id="box8">9</button>
    <button class="box" id="box9">x</button>
    <button class="box" id="box10">4</button>
    <button class="box" id="box11">5</button>
    <button class="box" id="box12">6</button>
    <button class="box" id="box13">-</button>
    <button class="box" id="box14">1</button>
    <button class="box" id="box15">2</button>
    <button class="box" id="box16">3</button>
    <button class="box" id="box17">+</button>
    <button class="box" id="box18">0</button>
    <button class="box" id="box19">.</button>
    <button class="box" id="box20">=</button>
  </div>
  
  <script src="index.js"></script>
</body>
</html>
